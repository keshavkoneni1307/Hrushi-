<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIT-AP Smart Bunk Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 sm:p-8">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="text-center py-4 border-b border-slate-700">
      <h1 class="text-3xl font-extrabold text-blue-400">VIT-AP Attendance Tracker</h1>
      <p class="text-slate-400 text-sm mt-1">Smart Bunk & Date Finder</p>
    </header>

    <!-- Step 1: Attendance Data -->
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-4">
      <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2">1. Current Attendance</h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Attended Classes</label>
          <input type="number" id="attended" value="25" min="0"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Total Happened</label>
          <input type="number" id="total" value="30" min="0"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Target %</label>
          <input type="number" id="targetPct" value="75" min="1" max="100"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <!-- Current Percentage Display -->
      <div class="flex items-center justify-between bg-slate-900 p-3.5 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400 font-medium">Current Percentage:</span>
        <span id="currentPctDisplay" class="text-xl font-black text-green-400">0.00%</span>
      </div>
    </div>

    <!-- Step 2: Subject Schedule & End Date -->
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-4">
      <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2">2. Subject Schedule & Last Date</h2>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-2">Kon-kon se din is subject ki class hoti hai?</label>
        <div class="grid grid-cols-4 sm:grid-cols-7 gap-2">
          <!-- Mon to Sun Checkboxes -->
          <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500">
            <input type="checkbox" class="day-check accent-blue-500 mb-1" value="1">
            <span class="text-xs font-bold text-slate-300">Mon</span>
          </label>
          <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500">
            <input type="checkbox" class="day-check accent-blue-500 mb-1" value="2" checked>
            <span class="text-xs font-bold text-slate-300">Tue</span>
          </label>
          <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500">
            <input type="checkbox" class="day-check accent-blue-500 mb-1" value="3">
            <span class="text-xs font-bold text-slate-300">Wed</span>
          </label>
          <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500">
            <input type="checkbox" class="day-check accent-blue-500 mb-1" value="4" checked>
            <span class="text-xs font-bold text-slate-300">Thu</span>
          </label>
          <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500">
            <input type="checkbox" class="day-check accent-blue-500 mb-1" value="5" checked>
            <span class="text-xs font-bold text-slate-300">Fri</span>
          </label>
          <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500">
            <input type="checkbox" class="day-check accent-blue-500 mb-1" value="6" checked>
            <span class="text-xs font-bold text-slate-300">Sat</span>
          </label>
          <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer hover:border-blue-500">
            <input type="checkbox" class="day-check accent-blue-500 mb-1" value="0">
            <span class="text-xs font-bold text-slate-300">Sun</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Classes Last Date (End Date)</label>
        <input type="date" id="endDate"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <!-- Output Section: Bunk Report -->
    <div id="reportCard" class="hidden bg-slate-800 p-6 rounded-2xl shadow-xl border border-blue-500/30 space-y-4">
      <h2 class="text-lg font-bold text-blue-400 border-b border-slate-700 pb-2">🎯 Smart Bunk Results</h2>

      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
          <span class="text-[10px] sm:text-xs text-slate-400 block">Remaining Classes</span>
          <p id="resFutureCount" class="text-base sm:text-lg font-bold text-slate-200">0</p>
        </div>
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
          <span class="text-[10px] sm:text-xs text-slate-400 block">Final Total</span>
          <p id="resFinalTotal" class="text-base sm:text-lg font-bold text-slate-200">0</p>
        </div>
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
          <span class="text-[10px] sm:text-xs text-slate-400 block">Allowed Bunks</span>
          <p id="resAllowedBunks" class="text-base sm:text-lg font-bold text-green-400">0</p>
        </div>
      </div>

      <div id="bunkAlertBox"></div>

      <div id="datesListContainer" class="hidden space-y-2">
        <h3 class="text-xs font-semibold text-slate-300">Kon-Kon se din skip kar sakte ho:</h3>
        <div id="datesList" class="max-h-52 overflow-y-auto space-y-1.5 pr-1"></div>
      </div>
    </div>

  </div>

  <!-- JavaScript Code -->
  <script>
    const attendedEl = document.getElementById('attended');
    const totalEl = document.getElementById('total');
    const targetPctEl = document.getElementById('targetPct');
    const endDateEl = document.getElementById('endDate');
    const dayCheckboxes = document.querySelectorAll('.day-check');

    const currentPctDisplay = document.getElementById('currentPctDisplay');
    const reportCard = document.getElementById('reportCard');
    const resFutureCount = document.getElementById('resFutureCount');
    const resFinalTotal = document.getElementById('resFinalTotal');
    const resAllowedBunks = document.getElementById('resAllowedBunks');
    const bunkAlertBox = document.getElementById('bunkAlertBox');
    const datesListContainer = document.getElementById('datesListContainer');
    const datesList = document.getElementById('datesList');

    function calculatePlanner() {
      const att = Math.max(0, parseInt(attendedEl.value) || 0);
      const tot = Math.max(0, parseInt(totalEl.value) || 0);
      const target = Math.max(1, parseInt(targetPctEl.value) || 75);

      // 1. Current Percentage
      if (tot > 0) {
        const currPct = ((att / tot) * 100).toFixed(2);
        currentPctDisplay.innerText = currPct + "%";
        currentPctDisplay.className = currPct >= target ? "text-xl font-black text-green-400" : "text-xl font-black text-red-400";
      } else {
        currentPctDisplay.innerText = "0.00%";
      }

      // 2. Schedule Calculation
      const endDateVal = endDateEl.value;
      if (!endDateVal) {
        reportCard.classList.add('hidden');
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const targetEnd = new Date(endDateVal);
      targetEnd.setHours(0, 0, 0, 0);

      if (isNaN(targetEnd.getTime()) || targetEnd <= today) {
        reportCard.classList.add('hidden');
        return;
      }

      // Active days selected
      const selectedDays = [];
      dayCheckboxes.forEach(cb => {
        if (cb.checked) selectedDays.push(parseInt(cb.value));
      });

      let futureClassesCount = 0;
      const upcomingDates = [];

      let currIter = new Date(today);
      currIter.setDate(currIter.getDate() + 1); // start from tomorrow

      while (currIter <= targetEnd) {
        const dayIdx = currIter.getDay(); // 0=Sun, 1=Mon, etc.

        if (selectedDays.includes(dayIdx)) {
          futureClassesCount++;
          upcomingDates.push({
            dateStr: currIter.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),
            dayName: currIter.toLocaleDateString('en-IN', { weekday: 'short' })
          });
        }
        currIter.setDate(currIter.getDate() + 1);
      }

      const finalTotalClasses = tot + futureClassesCount;
      const requiredAttended = Math.ceil((target / 100) * finalTotalClasses);
      const maxAttendedPossible = att + futureClassesCount;
      const maxBunksAllowed = maxAttendedPossible - requiredAttended;

      reportCard.classList.remove('hidden');
      resFutureCount.innerText = futureClassesCount;
      resFinalTotal.innerText = finalTotalClasses;

      if (maxBunksAllowed < 0) {
        resAllowedBunks.innerText = "0";
        resAllowedBunks.className = "text-base sm:text-lg font-bold text-red-400";
        bunkAlertBox.innerHTML = `
          <div class="bg-red-500/10 border border-red-500/30 p-3 rounded-xl text-red-300 text-xs sm:text-sm">
            ⚠️ <strong>Alert:</strong> Aap target ${target}% maintain nahi kar payenge agar ek bhi class skip ki! Aapko at least ${Math.abs(maxBunksAllowed)} aur classes attend karni padengi.
          </div>
        `;
        datesListContainer.classList.add('hidden');
      } else {
        resAllowedBunks.innerText = maxBunksAllowed;
        resAllowedBunks.className = "text-base sm:text-lg font-bold text-green-400";
        bunkAlertBox.innerHTML = `
          <div class="bg-green-500/10 border border-green-500/30 p-3 rounded-xl text-green-300 text-xs sm:text-sm">
            🎉 Aap end date tak Total <strong>${maxBunksAllowed}</strong> classes skip kar sakte hain!
          </div>
        `;

        // Render specific skip dates
        datesList.innerHTML = '';
        const datesToSkip = upcomingDates.slice(0, maxBunksAllowed);

        if (datesToSkip.length > 0) {
          datesToSkip.forEach(item => {
            const row = document.createElement('div');
            row.className = 'flex justify-between items-center bg-slate-900 px-3 py-2 rounded-lg border border-slate-700/60 text-xs';
            row.innerHTML = `
              <span class="font-semibold text-slate-200">${item.dateStr} (${item.dayName})</span>
              <span class="bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-medium">Safe to Skip</span>
            `;
            datesList.appendChild(row);
          });
          datesListContainer.classList.remove('hidden');
        } else {
          datesListContainer.classList.add('hidden');
        }
      }
    }

    // Attach Event Listeners
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', calculatePlanner);
      input.addEventListener('change', calculatePlanner);
    });

    calculatePlanner();
  </script>
</body>
</html>
