<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIT-AP Attendance & Bunk Planner</title>
  <style>
    :root {
      --bg: #0b132b;
      --card-bg: #1c2541;
      --accent: #3a86ff;
      --text: #edf2f4;
      --text-muted: #8d99ae;
      --success: #38b000;
      --danger: #d90429;
      --border: #2b2d42;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .calculator-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    h1 { font-size: 1.35rem; font-weight: 700; text-align: center; margin-bottom: 0.2rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 1.25rem; }
    .input-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.825rem; font-weight: 500; margin-bottom: 0.35rem; color: var(--text-muted); }
    input { width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; padding: 0.8rem; border-radius: 8px; border: none; background-color: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 0.4rem; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .result-box { margin-top: 1.25rem; padding: 1.1rem; border-radius: 10px; background-color: var(--bg); border: 1px solid var(--border); display: none; text-align: center; }
    .result-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.2rem; }
    .pct-info { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.6rem; }
    .status-badge { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.65rem; }
    .status-safe { background-color: rgba(56, 176, 0, 0.15); color: var(--success); }
    .status-warning { background-color: rgba(217, 4, 41, 0.15); color: var(--danger); }
    .advice-text { font-size: 0.9rem; line-height: 1.4; color: var(--text-muted); }
    .advice-text strong { color: var(--text); }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h1>VIT-AP Attendance Tracker</h1>
    <p class="subtitle">Bunk & Attendance Recovery Planner</p>

    <div class="input-group">
      <label for="attendedClasses">Classes Attended (A)</label>
      <input type="number" id="attendedClasses" placeholder="e.g. 21" min="0">
    </div>

    <div class="input-group">
      <label for="totalClasses">Total Classes Conducted (N)</label>
      <input type="number" id="totalClasses" placeholder="e.g. 26" min="1">
    </div>

    <div class="input-group">
      <label for="targetPct">Target Percentage (Y %)</label>
      <input type="number" id="targetPct" value="75" min="1" max="99" step="0.1">
    </div>

    <button onclick="calculateBunks()">Calculate Strategy</button>

    <div class="result-box" id="resultBox">
      <div id="statusBadge" class="status-badge"></div>
      <div class="result-title" id="resultTitle">0 Classes</div>
      <p class="pct-info" id="pctInfo"></p>
      <p class="advice-text" id="adviceText"></p>
    </div>
  </div>

  <script>
    function calculateBunks() {
      const attended = parseInt(document.getElementById('attendedClasses').value);
      const total = parseInt(document.getElementById('totalClasses').value);
      const target = parseFloat(document.getElementById('targetPct').value);

      const resultBox = document.getElementById('resultBox');
      const statusBadge = document.getElementById('statusBadge');
      const resultTitle = document.getElementById('resultTitle');
      const pctInfo = document.getElementById('pctInfo');
      const adviceText = document.getElementById('adviceText');

      if (isNaN(attended) || isNaN(total) || isNaN(target) || attended < 0 || total <= 0 || target <= 0 || target >= 100) {
        alert("Please enter valid positive numbers.");
        return;
      }
      if (attended > total) {
        alert("Attended classes cannot exceed total classes.");
        return;
      }

      const currentPct = (attended / total) * 100;
      resultBox.style.display = "block";
      pctInfo.innerHTML = `Current Attendance: <strong>${currentPct.toFixed(1)}%</strong>`;

      if (currentPct >= target) {
        const maxSkips = Math.floor((100 * attended - target * total) / target);
        statusBadge.innerText = "Safe Zone";
        statusBadge.className = "status-badge status-safe";
        resultTitle.style.color = "var(--success)";

        if (maxSkips > 0) {
          resultTitle.innerText = `Skip ${maxSkips} Class${maxSkips > 1 ? 'es' : ''}`;
          adviceText.innerHTML = `You can safely miss the next <strong>${maxSkips}</strong> class(es) while staying at or above <strong>${target}%</strong>.`;
        } else {
          resultTitle.innerText = `0 Classes To Skip`;
          adviceText.innerHTML = `You are right at the border! Do not miss your next class.`;
        }
      } else {
        const reqClasses = Math.ceil((target * total - 100 * attended) / (100 - target));
        statusBadge.innerText = "Shortage Alert";
        statusBadge.className = "status-badge status-warning";
        resultTitle.style.color = "var(--danger)";

        resultTitle.innerText = `Attend ${reqClasses} Class${reqClasses > 1 ? 'es' : ''}`;
        adviceText.innerHTML = `You must attend the next <strong>${reqClasses}</strong> consecutive class(es) to reach <strong>${target}%</strong>.`;
      }
    }
  </script>
</body>
</html>
